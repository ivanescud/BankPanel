<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Crest Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Gold Ring Accent -->
    <circle cx="40" cy="40" r="38" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.85"/>
    
    <!-- Emerald Shield Base -->
    <path d="M40 8 C58 8 68 22 68 42 C68 62 48 72 40 76 C32 72 12 62 12 42 C12 22 22 8 40 8 Z" fill="url(#emeraldGrad)" />
    
    <!-- Stylized Geometric Flower / Diamond in Core -->
    <path d="M40 18 C46 28 56 34 56 46 C56 56 48 64 40 68 C32 64 24 56 24 46 C24 34 34 28 40 18 Z" fill="#FFFFFF" opacity="0.15" />
    <path d="M40 26 L49 42 L40 58 L31 42 Z" fill="url(#goldGrad)" />
    <circle cx="40" cy="42" r="3.5" fill="#FFFFFF" />
  </g>
  
  <!-- Typography -->
  <!-- CREDICORD -->
  <text x="105" y="52" font-family="'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#046A38">
    CREDICORD
  </text>
  
  <!-- BANK & DEVPANEL -->
  <text x="108" y="76" font-family="'Inter', sans-serif" font-weight="700" font-size="14" letter-spacing="6" fill="#D4AF37">
    BANK
  </text>
  
  <text x="210" y="76" font-family="'Inter', sans-serif" font-weight="600" font-size="11" letter-spacing="3" fill="#64748B">
    | DEVPANEL
  </text>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="emeraldGrad" x1="12" y1="8" x2="68" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
</svg>
